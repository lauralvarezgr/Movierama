<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movierama</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="generos-flotantes"></div>
  <main class="panel">
    <header class="hero">
      <h1 id="titulo" class="titulo-meteoro">
        <span class="titulo-flota">
          <span class="titulo-giro">MOVIERAMA</span>
        </span>
      </h1>
    </header>
    <form id="form-buscar" class="buscador">
      <input id="buscar" type="search" placeholder="¿Qué película te apetece ver hoy?">
      <button type="submit">Buscar</button>
    </form>
    <p id="estado" class="estado"></p>
    <section id="rejilla" class="rejilla"></section>
    <button id="mas" class="btn-mas">Cargar más</button>
  </main>

  <section id="detalle" class="detalle" hidden></section>

  <script type="module" src="js/main.js" defer></script>


</body>

</html>
